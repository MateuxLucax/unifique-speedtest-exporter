# Build from source — no published image required:
#   docker compose -f docker-compose.build.yml up -d --build
# For easy replication from the prebuilt image, use docker-compose.yml instead.
services:
  speedtest-exporter:
    build: .
    image: unifique-speedtest-exporter:local
    container_name: unifique-speedtest-exporter
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # How often the test runs in the background (Go duration string).
      - RUN_INTERVAL=10m
    restart: unless-stopped
