services:
  speedtest-exporter:
    image: ghcr.io/mateuxlucax/unifique-speedtest-exporter:latest
    container_name: unifique-speedtest-exporter
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      # How often the test runs in the background (Go duration string).
      - RUN_INTERVAL=10m
    restart: unless-stopped
