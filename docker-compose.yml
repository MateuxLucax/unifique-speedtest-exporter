# Easy replication: pulls the prebuilt image published to GHCR on merge to main.
#   docker compose up -d
# To build from source instead, use docker-compose.build.yml.
services:
  speedtest-exporter:
    image: ghcr.io/mateuxlucax/unifique-speedtest-exporter:latest
    container_name: unifique-speedtest-exporter
    ports:
      # /metrics is unauthenticated, so bind to loopback by default. To let a
      # remote Prometheus scrape it, change this to "3000:3000" and put it
      # behind trusted network controls (firewall / reverse proxy).
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      # How often the test runs in the background (Go duration string).
      - RUN_INTERVAL=10m
    restart: unless-stopped
